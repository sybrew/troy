name: Build Release Packages

on:
  push:
    tags:
      - '*'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract versions from plugin files
        id: versions
        run: |
          SEMVER_REGEX='Version:\s*(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?'
          SERVER_VERSION=$(head -30 src/troy-server/troy-server.php | grep -oP 'Version:\s*\K(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?')
          CLIENT_VERSION=$(head -30 src/troy-client/troy-client.php | grep -oP 'Version:\s*\K(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?')
          DAEMON_VERSION=$(head -30 src/troy-client-daemon/troy-client-daemon.php | grep -oP 'Version:\s*\K(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?')
          echo "server=$SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "client=$CLIENT_VERSION" >> $GITHUB_OUTPUT
          echo "daemon=$DAEMON_VERSION" >> $GITHUB_OUTPUT
          echo "Server version: $SERVER_VERSION"
          echo "Client version: $CLIENT_VERSION"
          echo "Daemon version: $DAEMON_VERSION"

      - name: Create troy-server.zip
        run: |
          cd src/troy-server
          zip -r ../../troy-server-${{ steps.versions.outputs.server }}.zip . -x "*.git*"

      - name: Create troy-client.zip
        run: |
          cd src/troy-client
          zip -r ../../troy-client-${{ steps.versions.outputs.client }}.zip . -x "*.git*"

      - name: Create troy-client-daemon.zip
        run: |
          cd src/troy-client-daemon
          zip -r ../../troy-client-daemon-${{ steps.versions.outputs.daemon }}.zip . -x "*.git*"

      - name: Create snippets.zip
        run: |
          mkdir -p snippets-temp/troy-client-channel
          mkdir -p snippets-temp/troy-client-hide
          mkdir -p snippets-temp/troy-embed
          cp -r src/troy-client-channel/* snippets-temp/troy-client-channel/
          cp -r src/troy-client-hide/* snippets-temp/troy-client-hide/
          cp -r src/troy-embed/* snippets-temp/troy-embed/
          cd snippets-temp
          zip -r ../snippets.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            troy-server-${{ steps.versions.outputs.server }}.zip
            troy-client-${{ steps.versions.outputs.client }}.zip
            troy-client-daemon-${{ steps.versions.outputs.daemon }}.zip
            snippets.zip
          generate_release_notes: true
