name: Build Release Packages

# To run this workflow, create a new tag and push it to the repository.
#
# Example:
#   git tag v1.0.1184
#   git push origin v1.0.1184
#
# After pushing the tag, this workflow will automatically create
# a draft release with the corresponding release packages attached.
#
# NOTE: Immutable tags are ENABLED for this repository to ensure release integrity.
#       Once a tag is pushed, it cannot be modified or deleted.

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract versions from plugin files
        id: versions
        run: |
          SEMVER_REGEX='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?'
          SERVER_VERSION=$(head -30 src/troy-server/troy-server.php | grep -oP "Version:\s*\K$SEMVER_REGEX")
          CLIENT_VERSION=$(head -30 src/troy-client/troy-client.php | grep -oP "Version:\s*\K$SEMVER_REGEX")
          DAEMON_VERSION=$(head -30 src/troy-client-daemon/troy-client-daemon.php | grep -oP "Version:\s*\K$SEMVER_REGEX")
          echo "server=$SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "client=$CLIENT_VERSION" >> $GITHUB_OUTPUT
          echo "daemon=$DAEMON_VERSION" >> $GITHUB_OUTPUT
          echo "Server version: $SERVER_VERSION"
          echo "Client version: $CLIENT_VERSION"
          echo "Daemon version: $DAEMON_VERSION"

      - name: Create troy-server.zip
        run: |
          git archive --format=zip --prefix=troy-server/ -o troy-server-${{ steps.versions.outputs.server }}.zip HEAD:src/troy-server

      - name: Create troy-client.zip
        run: |
          git archive --format=zip --prefix=troy-client/ -o troy-client-${{ steps.versions.outputs.client }}.zip HEAD:src/troy-client

      - name: Create troy-client-daemon.zip
        run: |
          git archive --format=zip --prefix=troy-client-daemon/ -o troy-client-daemon-${{ steps.versions.outputs.daemon }}.zip HEAD:src/troy-client-daemon

      - name: Create snippets.zip
        run: |
          mkdir -p snippets-temp
          git archive --format=tar HEAD:src/troy-client-channel | tar -xf - -C snippets-temp --transform='s,^,troy-client-channel/,'
          git archive --format=tar HEAD:src/troy-client-hide | tar -xf - -C snippets-temp --transform='s,^,troy-client-hide/,'
          git archive --format=tar HEAD:src/troy-embed | tar -xf - -C snippets-temp --transform='s,^,troy-embed/,'
          cd snippets-temp
          zip -r ../snippets.zip .

      - name: Create draft and append files to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            troy-server-${{ steps.versions.outputs.server }}.zip
            troy-client-${{ steps.versions.outputs.client }}.zip
            troy-client-daemon-${{ steps.versions.outputs.daemon }}.zip
            snippets.zip
          generate_release_notes: true
